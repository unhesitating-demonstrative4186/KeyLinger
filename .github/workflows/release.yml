name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build Apple Silicon app
        run: ./build_app.sh release arm64

      - name: Create Apple Silicon DMG
        run: ./scripts/create_dmg.sh "$GITHUB_REF_NAME" arm64

      - name: Build Intel app
        run: ./build_app.sh release x86_64

      - name: Create Intel DMG
        run: ./scripts/create_dmg.sh "$GITHUB_REF_NAME" x86_64

      - name: Create checksum
        run: |
          cd dist
          shasum -a 256 \
            "KeyLinger-${GITHUB_REF_NAME}-macOS-Apple-Silicon.dmg" \
            "KeyLinger-${GITHUB_REF_NAME}-macOS-Intel.dmg" \
            > "KeyLinger-${GITHUB_REF_NAME}-SHA256.txt"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/KeyLinger-${GITHUB_REF_NAME}-macOS-Apple-Silicon.dmg" \
            "dist/KeyLinger-${GITHUB_REF_NAME}-macOS-Intel.dmg" \
            "dist/KeyLinger-${GITHUB_REF_NAME}-SHA256.txt" \
            --verify-tag \
            --generate-notes \
            --title "KeyLinger $GITHUB_REF_NAME"
