name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build debug target
        run: swift build

      - name: Validate keyboard layout
        run: swift run KeyLinger --validate-keyboard-layout

      - name: Build Apple Silicon app
        run: ./build_app.sh release arm64

      - name: Verify Apple Silicon bundle
        run: |
          codesign --verify --deep --strict dist/KeyLinger.app
          test "$(lipo -archs dist/KeyLinger.app/Contents/MacOS/KeyLinger)" = "arm64"
          test -f dist/KeyLinger.app/Contents/Resources/AppIcon.icns
          test -f dist/KeyLinger.app/Contents/Resources/zh-Hant.lproj/Localizable.strings
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' dist/KeyLinger.app/Contents/Info.plist)" = "AppIcon.icns"
          plutil -lint dist/KeyLinger.app/Contents/Info.plist

      - name: Build Intel app
        run: ./build_app.sh release x86_64

      - name: Verify Intel bundle
        run: |
          codesign --verify --deep --strict dist/KeyLinger.app
          test "$(lipo -archs dist/KeyLinger.app/Contents/MacOS/KeyLinger)" = "x86_64"
          test -f dist/KeyLinger.app/Contents/Resources/AppIcon.icns
          test -f dist/KeyLinger.app/Contents/Resources/zh-Hant.lproj/Localizable.strings
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' dist/KeyLinger.app/Contents/Info.plist)" = "AppIcon.icns"
          plutil -lint dist/KeyLinger.app/Contents/Info.plist

      - name: Verify localizations
        run: ./scripts/check_localizations.sh
